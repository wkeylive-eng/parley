<style>

  const scored = out.filter((x) => x.heard);
  const score = scored.length ? Math.round(scored.reduce((a, x) => a + x.score, 0) / scored.length) : null;
  if (score !== null) { stats.n++; stats.sum += score; lsSet("tonelab-stats", JSON.stringify(stats)); }
  return { v, segs: out, score, t0: v[0].t, t1: v[v.length - 1].t, approx: !range };
}

// ───────── drawing ─────────
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function draw() {
  const c = $("#chart"); if (!c) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const padL = 40, padR = 10, padT = 12, padB = 14;
  const y = (lvl) => padT + ((5.5 - lvl) / 5) * (H - padT - padB);
  g.font = "11px " + css("--mono"); g.fillStyle = css("--muted"); g.strokeStyle = css("--line"); g.lineWidth = 1;
  [["5", "high"], ["3", "mid"], ["1", "low"]].forEach(([l, name]) => { g.beginPath(); g.moveTo(padL, y(+l)); g.lineTo(W - padR, y(+l)); g.stroke(); g.fillText(name, 4, y(+l) + 4); });
  const res = lastResult;
  const item = current(), pattern = item[3];
  // target band(s)
  const t0 = res && res.v ? res.t0 : 0, t1 = res && res.v ? res.t1 : 1;
  const x = (t) => padL + ((t - t0) / Math.max(0.05, t1 - t0)) * (W - padL - padR);
  const spans = res && res.segs ? res.segs.map((s) => [s.seg[0].t, s.seg[s.seg.length - 1].t]) : pattern.split("").map((_, i, a) => [t0 + ((t1 - t0) * i) / a.length + 0.02, t0 + ((t1 - t0) * (i + 1)) / a.length - 0.02]);
  g.lineCap = "round"; g.lineJoin = "round";
  pattern.split("").forEach((tn, i) => {
    if (tn === "0" || !spans[i]) return;
    const tpl = tn === "3" ? (i === pattern.length - 1 ? TPL["3f"] : TPL["3h"]) : TPL[tn];
    const [a, b] = spans[i];
    g.strokeStyle = css("--band"); g.lineWidth = 18; g.beginPath();
    tpl.forEach((lv, k) => { const xx = x(a + ((b - a) * k) / 11), yy = y(lv); k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); });
    g.stroke();
  });
  if (!res || !res.v) { g.fillStyle = css("--muted"); g.font = "13px " + css("--body"); g.fillText("Shaded: target. Yours draws on top.", padL + 6, H - 22); return; }
  g.strokeStyle = css("--accent"); g.lineWidth = 3;
  let prev = null;
  res.v.forEach((p) => { const xx = x(p.t), yy = y(p.lvl); if (prev && p.t - prev.t < 0.08) { g.beginPath(); g.moveTo(x(prev.t), y(prev.lvl)); g.lineTo(xx, yy); g.stroke(); } prev = p; });
}

// ───────── views ─────────
const current = () => (mode === "test" ? ["", "", "", "11"] : SETS[mode][idx % SETS[mode].length]);
function envNotice() {
  const notes = [];
  if (!MIC_OK) notes.push("This browser can't use the microphone here. Open the page in Safari over https.");
  if (mode === "test" && (!SR || STANDALONE)) notes.push("The listener test uses Apple's speech recognition, which only works when this page is open in a regular Safari tab (not from the Home Screen). Siri or Dictation also needs to be on.");
  if (!range && mode !== "test") notes.push("First, set your voice range so the chart knows what high and low mean for you.");
  return notes.length ? `<div class="card notice">${notes.map((n) => `<p class="small">${esc(n)}</p>`).join("")}${!range && mode !== "test" && MIC_OK ? `<button class="btn primary" data-act="calibrate">${calibrating && recording ? "Listening… say mā má mǎ mà" : "Set my voice range"}</button>` : ""}</div>` : "";
}
function render() {
  document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  $("#stat").textContent = stats.n ? `avg ${Math.round(stats.sum / stats.n)} · ${stats.n} tries` : "";
  $("#env").innerHTML = envNotice();
  if (mode === "test") return renderTest();
  const item = current(), [hz, py, en, pat, note] = item, res = lastResult;
  let verdict = "";
  if (res && res.calibrated) verdict = `<p><b class="ok">Voice range saved.</b> Now try the word above.</p>`;
  else if (res && res.error) verdict = `<p class="small">${esc(res.error)}</p>`;
  else if (res && res.segs) {
    verdict = res.segs.map((s, i) => {
      if (!s.heard) return s.target === "0" ? `<p class="small">Syllable ${i + 1}: neutral tone. Keep it short and light.</p>` : "";
      const ok = s.heard === s.target;
      return `<p>Syllable ${i + 1}: target ${toneGlyph(s.target)} ${s.target}, ${ok ? `<b class="ok">sounded right</b>` : `<b class="no">sounded like ${s.heard}</b>`} <span class="mono small muted">${s.score}</span>${ok ? "" : `<br><span class="small">${esc(TIPS[s.target + ">" + s.heard] || "Listen again and copy the shape.")}</span>`}</p>`;
    }).join("") + (res.score !== null ? `<p class="big-result mono">${res.score}<span class="muted small"> / 100</span></p>` : "") + (res.approx ? `<p class="muted small">Rough reading: set your voice range for accurate high and low.</p>` : "");
  }
  $("#main").innerHTML = `
    <div class="card">
      <div class="word"><div><p class="hz" lang="zh-CN">${esc(hz)}</p><p class="mono">${esc(py)}</p><p class="muted">${esc(en)}</p></div>
        <div class="row" style="gap:2px">${pat.split("").map(toneGlyph).join("")}</div></div>
      ${note ? `<p class="small">${esc(note)}</p>` : ""}
      <canvas id="chart" aria-label="Pitch chart"></canvas>
      <div class="row between">
        <button class="btn" data-act="hear">Hear it</button>
        <button class="rec ${recording ? "live" : ""}" data-act="rec" aria-label="${recording ? "Stop" : "Record"}" ${MIC_OK ? "" : "disabled"}>${recording ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'}</button>
        <button class="btn" data-act="next">Next</button>
      </div>
      <div class="verdict">${verdict}</div>
      ${myAudioUrl ? `<button class="btn ghost" data-act="mine">Play my recording</button>` : ""}
    </div>
    <p class="muted small">Listen to the model first (it plays when a new word appears), then tap the mic and copy it once; recording stops by itself. Practicing speaking builds speaking and listening practice builds listening, so pair this with the Tones drill in Parley.</p>
    ${range ? `<button class="btn ghost" data-act="calibrate">${calibrating && recording ? "Listening… say mā má mǎ mà" : "Reset my voice range"}</button>` : ""}`;
  requestAnimationFrame(draw);
}
let testIdx = 0, testWord = null;
function newTestWord() { const p = PAIRS[Math.floor(Math.random() * PAIRS.length)], k = Math.random() < 0.5 ? 0 : 3; testWord = { hz: p[k], py: p[k + 1], en: p[k + 2], other: p[3 - k], otherPy: p[4 - k], otherEn: p[5 - k] }; testResult = null; }
function renderTest() {
  if (!testWord) newTestWord();
  const w = testWord, r = testResult, can = SR && !STANDALONE;
  $("#main").innerHTML = `
    <div class="card">
      <p class="muted">Say this word. Apple's speech recognizer plays the listener: it can't lean on context, so only your tones tell it which word you meant.</p>
      <div><p class="hz" lang="zh-CN">${esc(w.hz)}</p><p class="mono">${esc(w.py)}</p><p class="muted">${esc(w.en)}</p></div>
      <p class="small muted">Not to be confused with ${esc(w.other)} ${esc(w.otherPy)} (${esc(w.otherEn)}).</p>
      <div class="row between">
        <button class="btn" data-act="hear-test">Hear it</button>
        <button class="rec ${recording ? "live" : ""}" data-act="say-test" aria-label="Say it" ${can ? "" : "disabled"}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="btn" data-act="next-test">Next</button>
      </div>
      ${r ? `<div class="verdict">${r.ok ? `<p class="big-result" style="color:var(--good)">Understood ✓</p>` : r.other ? `<p class="big-result" style="color:var(--bad)">Heard as ${esc(w.other)}</p><p class="small">Your tones said "${esc(w.otherEn)}". Practice ${esc(w.py)} in the other sets, then try again.</p>` : `<p class="big-result">Unclear</p>`}<p class="muted small">Recognizer heard: “${esc(r.text || "nothing")}”</p></div>` : ""}
    </div>
    <p class="muted small mono">${stats.test ? `${stats.testOk} / ${stats.test} understood` : ""}</p>
    <p class="muted small">Recognizers favor common words, so getting the rarer word of each pair right (水饺, 亲吻, 大姨, 雹子) is the stronger proof your tones are working.</p>`;
}
function sayTest() {
  if (!SR || STANDALONE || recording) return;
  try { synth && synth.cancel(); } catch {}
  const rec = new SR(); rec.lang = "zh-CN"; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
  let text = "";
  rec.onresult = (e) => { text = Array.from(e.results).map((x) => x[0].transcript).join(""); };
  rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") text = "(microphone or speech recognition not allowed)"; };
  rec.onend = () => {
    recording = false;
    const clean = text.replace(/[\s\p{P}]/gu, "");
    const ok = clean.includes(testWord.hz), other = !ok && clean.includes(testWord.other);
    testResult = { ok, other, text }; stats.test++; if (ok) stats.testOk++; lsSet("tonelab-stats", JSON.stringify(stats));
    render();
  };
  recording = true; render(); rec.start();
}

document.addEventListener("click", async (e) => {
  const m = e.target.closest("[data-mode]");
  if (m) { mode = m.dataset.mode; lsSet("tonelab-mode", mode); idx = 0; lastResult = null; testResult = null; render(); if (mode !== "test") hear(current()[0]); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act;
  try {
    if (act === "hear") hear(current()[0]);
    else if (act === "next") { idx++; lastResult = null; if (myAudioUrl) { URL.revokeObjectURL(myAudioUrl); myAudioUrl = null; } render(); hear(current()[0]); }
    else if (act === "rec") { if (recording) stopRecording(); else { calibrating = false; await startRecording(); } }
    else if (act === "calibrate") { if (recording) return; calibrating = true; await startRecording(); }
    else if (act === "mine" && myAudioUrl) new Audio(myAudioUrl).play();
    else if (act === "hear-test") hear(testWord.hz);
    else if (act === "say-test") sayTest();
    else if (act === "next-test") { newTestWord(); render(); }
  } catch (err) {
    recording = false; calibrating = false;
    lastResult = { error: err && err.name === "NotAllowedError" ? "Microphone access was blocked. In iOS Settings › Safari › Microphone, allow it, then reload." : "Couldn't start the microphone: " + (err && err.message ? err.message : err) };
    render();
  }
});
window.addEventListener("resize", () => requestAnimationFrame(draw));
render();
</script>
</body>
</html>
