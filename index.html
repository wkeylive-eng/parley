<style>
/* Layout: one-screen app — scrolling view above a fixed tab bar; cards only where an item is a distinct object. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #E2E7EC;
  --line: #CFD6DE;
  --ink: #141820;
  --muted: #586272;
  --accent: #0A7782;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3ECEE;
  --gold: #B87410;
  --gold-soft: #F6E8CB;
  --good: #1D8752;
  --warn: #A86D12;
  --bad: #C23838;
  --polite: #2F5FD0;
  --display: "Bricolage Grotesque", ui-rounded, system-ui, -apple-system, "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans CJK JP", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1215; --surface: #171B20; --surface-2: #20262D; --line: #2C333C; --ink: #E8ECF0; --muted: #949CA9;
    --accent: #3ABDC8; --accent-ink: #03262A; --accent-soft: #12353A; --gold: #F0B04A; --gold-soft: #3A2D16;
    --good: #48C985; --warn: #E5AE4C; --bad: #F06C6C; --polite: #85A6FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1215; --surface: #171B20; --surface-2: #20262D; --line: #2C333C; --ink: #E8ECF0; --muted: #949CA9;
  --accent: #3ABDC8; --accent-ink: #03262A; --accent-soft: #12353A; --gold: #F0B04A; --gold-soft: #3A2D16;
  --good: #48C985; --warn: #E5AE4C; --bad: #F06C6C; --polite: #85A6FF; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 2.6rem; font-weight: 800; line-height: 1; }
h2 { font-size: 1.25rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 0.92rem; }
.small { font-size: 0.82rem; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.row.wrap-ok { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.btn { appearance: none; border: 1px solid transparent; border-radius: 12px; padding: 13px 16px; font: 700 1rem var(--body); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.sm { padding: 8px 12px; font-size: 0.9rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .icon:focus-visible, #tabs button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { appearance: none; border: 0; background: transparent; color: var(--accent); padding: 6px; border-radius: 999px; cursor: pointer; display: inline-flex; flex: none; }
.icon svg { width: 22px; height: 22px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrapping { flex-wrap: wrap; overflow: visible; }
.chip { appearance: none; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 13px; font: 700 0.9rem var(--body); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.alt.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar.gold > i { background: var(--gold); }
.bar.good > i { background: var(--good); }
input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; font: 1rem var(--body); color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
textarea { resize: none; }
label.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; }
label.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.notice { border-left: 0; background: var(--gold-soft); border-color: transparent; }
.err { color: var(--bad); font-size: 0.92rem; }

/* register meter: polite → crude */
.reg { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; color: var(--muted); }
.reg .dots { display: inline-flex; gap: 2px; }
.reg .dots i { width: 6px; height: 6px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.reg .dots i.f { border-color: transparent; background: currentColor; }
.reg-polite { color: var(--polite); } .reg-neutral { color: var(--muted); } .reg-casual { color: var(--good); } .reg-slang { color: var(--gold); } .reg-crude { color: var(--bad); }

/* today */
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero h1 { font-size: clamp(2.8rem, 14vw, 4.2rem); }
.streak { text-align: right; }
.streak b { font: 800 2rem/1 var(--display); color: var(--gold); display: block; }
.steps { display: flex; flex-direction: column; gap: 0; }
.step { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; text-align: left; font: inherit; width: 100%; }
.step:first-child { border-top: 0; }
.step .n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 0.95rem var(--mono); background: var(--surface-2); }
.step.due .n { background: var(--accent); color: var(--accent-ink); }
.step.done .n { background: var(--good); color: #fff; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font: 700 1.3rem var(--mono); }
.stat span { font-size: 0.72rem; color: var(--muted); }

/* talk */
.scen { text-align: left; font: inherit; color: inherit; cursor: pointer; }
.scen:disabled { opacity: 0.5; cursor: default; }
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 90%; display: flex; flex-direction: column; gap: 6px; }
.msg.them { align-self: flex-start; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.bubble { border-radius: 16px; padding: 12px 14px; min-width: 0; overflow-wrap: anywhere; }
.them .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
.me .bubble { background: var(--accent); color: var(--accent-ink); border-top-right-radius: 4px; }
.target { font-size: 1.2rem; line-height: 1.4; }
.linkish { appearance: none; background: none; border: 0; padding: 0; color: var(--accent); font: 700 0.88rem var(--body); cursor: pointer; text-align: left; }
.mine { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--accent-soft); border: 0; border-radius: 12px; padding: 9px 10px; color: var(--ink); font: inherit; cursor: pointer; }
.mine .plus { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.mine.added .plus { background: var(--good); color: #fff; }
.fix { background: var(--gold-soft); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; align-self: stretch; color: var(--ink); }
.fix .hint { font-weight: 700; color: var(--warn); }
.composer { position: sticky; bottom: -28px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) -28px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 46px; max-height: 120px; }
.round { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.round.live { background: var(--bad); color: #fff; }
.round.off { background: var(--surface-2); color: var(--muted); }
.round svg { width: 22px; height: 22px; }

/* review */
.flash { min-height: 230px; justify-content: center; }
.answer { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.answer .target { color: var(--accent); font-size: 1.5rem; font-weight: 700; }
.prompt { font: 800 1.6rem/1.25 var(--display); }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grade { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 700 0.95rem var(--body); }
.grade small { font: 500 0.78rem var(--mono); }
.g1 small { color: var(--bad); } .g2 small { color: var(--warn); } .g3 small { color: var(--good); } .g4 small { color: var(--polite); }

/* phrases */
.phrase { display: flex; gap: 8px; align-items: flex-start; padding-top: 12px; border-top: 1px solid var(--line); }
.phrase .t { font-weight: 700; font-size: 1.05rem; }
details.card { display: block; }
details.card > * + * { margin-top: 12px; }
details.pack > summary { list-style: none; cursor: pointer; }
details.pack > summary::-webkit-details-marker { display: none; }
.caret { transition: transform 0.15s; color: var(--muted); }
details[open] .caret { transform: rotate(180deg); }

/* drill */
.timer { font: 800 clamp(4rem, 26vw, 6.5rem)/1 var(--display); text-align: center; font-variant-numeric: tabular-nums; }
.timer.live { color: var(--accent); }
.tg { width: 26px; height: 26px; }
.grade.right { border: 2px solid var(--good); }
.grade.wrong { border: 2px solid var(--bad); }
.tone-opt { padding: 12px 6px; gap: 6px; }
.sent { appearance: none; border: 0; background: transparent; color: var(--ink); text-align: left; font: inherit; padding: 8px 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.sent.on { background: var(--accent-soft); }
.sent .target { font-size: 1.15rem; }
.live-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; }

#tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#tabs button { appearance: none; border: 0; background: none; color: var(--muted); padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 0.7rem var(--body); cursor: pointer; }
#tabs button[aria-current="page"] { color: var(--accent); }
#tabs svg { width: 23px; height: 23px; }
#tabs .badge { position: absolute; margin-left: 22px; margin-top: -2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font: 700 0.65rem/16px var(--mono); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 48px); text-align: center; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>


</head>

<div id="app">

    <button data-tab="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Talk</button>

  </nav>
</div>

function toneGlyph(t) {
  if (t === "0") return '<svg class="tg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="15" r="3" fill="currentColor"/></svg>';
  const d = { "1": "M3 6 H21", "2": "M3 18 L21 5", "3": "M3 11 L10 19 L21 7", "4": "M3 5 L21 19" }[t];
  return `<svg class="tg" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const toneName = (p) => p.split("").map((t) => (t === "0" ? "neutral" : t)).join(" + ");
const toneGlyphs = (p) => `<span class="row" style="gap:2px">${p.split("").map(toneGlyph).join("")}</span>`;
function pickToneMode() {
  const s = Object.entries(S.toneStats).filter(([k]) => k[0] === "s");
  const n = s.reduce((a, [, v]) => a + v.n, 0), ok = s.reduce((a, [, v]) => a + v.ok, 0);
  return n < 20 || ok / n < 0.8 ? "single" : "pairs";
}
function newToneRound() {
  const st = S.toneStats, single = U.tones.mode === "single", list = single ? SINGLE_WORDS : TONE_WORDS;
  const key = (p) => (single ? "s" : "") + p;
  const w = list.map((x) => { const s = st[key(x[3])]; return s && s.n ? 1 + 4 * (1 - s.ok / s.n) : 2.5; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0), pick = list[0];
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) { pick = list[i]; break; } }
  if (U.tones.cur && U.tones.cur.w === pick && list.length > 1) pick = list[(list.indexOf(pick) + 1) % list.length];
  const p = pick[3];
  const near = TONE_PATTERNS.filter((q) => q !== p && (q[0] === p[0] || q[1] === p[1])).sort(() => Math.random() - 0.5).slice(0, 3);
  U.tones.cur = { w: pick, single, opts: single ? ["1", "2", "3", "4"] : [p, ...near].sort(() => Math.random() - 0.5) };
  U.tones.answered = null;
}
VIEWS.tones = () => {
  const T = U.tones; if (!T.cur) newToneRound();
  const [hz, py, en, p] = T.cur.w, a = T.answered;
  const hard = Object.entries(S.toneStats).filter(([, s]) => s.n >= 3).map(([k, s]) => [k, s.ok / s.n]).sort((x, y) => x[1] - y[1]).slice(0, 4);
  return `<div class="wrap">
    <div class="row between"><h1>Tones</h1><button class="btn sm ghost" data-act="tab" data-v="today">Close</button></div>
    <p class="muted">Train your ear. Each word plays in a different voice, pitch and speed, which is what makes tone training carry over to real speakers. Anything you miss comes back more often.</p>
    <div class="chips"><button class="chip ${T.mode === "single" ? "on" : ""}" data-act="tone-mode" data-v="single">Single tones</button><button class="chip ${T.mode === "pairs" ? "on" : ""}" data-act="tone-mode" data-v="pairs">Tone pairs</button></div>
    <div class="card" style="align-items:center;text-align:center;min-height:170px;justify-content:center">
      <p class="eyebrow">Which tones do you hear?</p>
      ${a ? `<p class="target" style="font-size:2.4rem;font-weight:700" lang="zh-CN">${esc(hz)}</p><p class="mono">${esc(py)}</p><p class="muted">${esc(en)}</p>
        <p style="font-weight:700;color:var(--${a === p ? "good" : "bad"})">${a === p ? "Correct" : "It was " + toneName(p)}</p>` : `<p class="prompt" aria-hidden="true">？</p>`}
      <button class="btn quiet" data-act="tone-play">Play again</button>
    </div>
    <div class="grades" style="grid-template-columns:repeat(2,minmax(0,1fr))">${T.cur.opts.map((o) => `<button class="grade tone-opt ${a ? (o === p ? "right" : o === a ? "wrong" : "") : ""}" data-act="tone-pick" data-v="${o}" ${a ? "disabled" : ""}>${toneGlyphs(o)}<small>${T.cur.single ? "Tone " + o : toneName(o)}</small></button>`).join("")}</div>
    ${a ? `<button class="btn" data-act="tone-next">Next pair</button>` : ""}
    <p class="muted small mono">${T.right} / ${T.total} right this session</p>
    ${hard.length ? `<div class="card"><h3>Your hardest pairs</h3>${hard.map(([k, v]) => `<div class="row between">${toneGlyphs(k.replace("s", ""))}<span class="grow small">${k[0] === "s" ? "Tone " + k[1] + " alone" : toneName(k)}</span><span class="mono small">${Math.round(v * 100)}%</span></div>`).join("")}</div>` : ""}
    <div class="card"><h3>Tone change rules</h3>
      <p class="small">Two 3rd tones in a row: the first becomes a 2nd. 你好 is said ní hǎo.</p>
      <p class="small">不 before a 4th tone becomes bú: 不是 bú shì.</p>
      <p class="small">一 before a 4th tone becomes yí (一个 yí ge); before other tones it becomes yì (一天 yì tiān).</p></div>
    ${S.settings.toneLabUrl ? `<a class="btn ghost" href="${esc(S.settings.toneLabUrl)}" target="_blank" rel="noopener">Practice saying tones in the Tone Lab</a>` : ""}
  </div>`;
};

function knownTargets(code) {

        const n = addCards(items, lang.code, variant.id, "core");
        S.corePath[lang.code] = (S.corePath[lang.code] || 0) + 1; save(); toast(`Added ${n} core phrases to your deck`);
      } catch (e) { U.coreErr = e.message; }
      U.coreBusy = false; render(); break;
    }

    // tones
    case "tone-mode": U.tones.mode = v; newToneRound(); render(); speakVaried(U.tones.cur.w[0], "zh-CN"); break;
    case "tones": if (!U.tones.mode) U.tones.mode = pickToneMode(); newToneRound(); U.tab = "tones"; render(); speakVaried(U.tones.cur.w[0], "zh-CN"); break;
    case "tone-play": speakVaried(U.tones.cur.w[0], "zh-CN"); break;
    case "tone-pick": {
      const T = U.tones, p = T.cur.w[3], ok = v === p, k = (T.cur.single ? "s" : "") + p;
      const s = S.toneStats[k] || { n: 0, ok: 0 }; S.toneStats[k] = { n: s.n + 1, ok: s.ok + (ok ? 1 : 0) };
      T.answered = v; T.total++; if (ok) T.right++; addXp(ok ? 3 : 1); save(); render();
      if (!ok) speakVaried(T.cur.w[0], "zh-CN");
      break;
    }
    case "tone-next": newToneRound(); render(); speakVaried(U.tones.cur.w[0], "zh-CN"); break;
    case "save-tonelab": { const u = ($("#tonelab") || {}).value?.trim() || ""; if (u && !/^https:\/\//.test(u)) { toast("Use the full https:// link"); break; } S.settings.toneLabUrl = u; save(); toast(u ? "Tone Lab link saved" : "Tone Lab link removed"); render(); break; }

    // drill
    case "drill": startDrill(); U.tab = "drill"; render(); break;
    case "drill-topic": startDrill(); render(); break;
    case "drill-start": drillStart(); break;
    case "drill-stop": drillFinish(); break;
    case "drill-again": startDrill(U.drill.topic); render(); break;
    case "drill-new": startDrill(); render(); break;
    case "drill-fb": {
      const D = U.drill, last = [...D.results].reverse().find((r) => r.transcript); if (!last) break;
      D.busy = true; D.err = null; render();
      try {
        const sys = `You are a supportive ${lang.name} speaking coach from ${variant.label}. Learner level: ${LEVEL_GUIDE[S.settings.level]}`;
        const prompt = `The learner spoke for about a minute on: "${D.topic}". Speech-to-text transcript (may contain recognition errors; ignore those):
"""${last.transcript}"""
Give feedback that makes the next attempt more fluent and natural:
- summary: 1-2 sentences in English on what went well and the main thing to work on.
- fixes: up to 4 items, each a phrase they said and how a local from ${variant.label} would say it.
- phrases: 3-5 chunks they could have used on this topic (fillers, connectors, natural expressions).
Return ONLY JSON: {"summary": "...", "fixes": [{"said": "...", "better": "...", "why": "..."}], "phrases": [{"target": "...", ${lang.romanize ? '"romanization": "...", ' : ""}"meaning": "...", "register": "polite|neutral|casual|slang|crude", "note": "..."}]}`;
        const j = await aiJSON(sys, [{ role: "user", content: prompt }], 1500);
        if (U.drill !== D) return;
        D.fb = { summary: String(j.summary || ""), fixes: Array.isArray(j.fixes) ? j.fixes.map((f) => ({ said: String(f.said || ""), better: String(f.better || ""), why: String(f.why || "") })) : [], phrases: cleanPhrases(j.phrases, lang.romanize) };
      } catch (e) { D.err = e.message; }
      D.busy = false; render(); break;
    }
    case "drill-add": { const D = U.drill; addCards(D.fb.phrases, lang.code, variant.id, "drill"); D.added = true; render(); break; }
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "sayBox") U.review.said = ev.target.value;
  if (ev.target.id === "drillBox" && U.drill) U.drill.transcript = ev.target.value;
  if (ev.target.id === "draft") {
    U.talk.draft = ev.target.value;
    const b = $("#sendBtn"); if (b) b.classList.toggle("off", !ev.target.value.trim());
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.id === "draft" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); talkSubmit(); }
  if (ev.target.id === "sayBox" && ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); const b = document.querySelector('[data-act="reveal"]'); if (b) b.click(); }
});
document.addEventListener("change", (ev) => { if (ev.target.id === "autoSpeak") { S.settings.autoSpeak = ev.target.checked; save(); } });

// ───────── durable storage inside the Claude app ─────────
(async () => {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db) return;
  try {
    const [qs, meta] = await Promise.all([db.collection("slang_zh").get(), db.doc("meta/slang_zh").get()]);
    LIVE = { items: qs.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })), meta: meta.exists ? meta.data() : null };
    render();
  } catch {}
  if (!user) return;
  const id = await user.id(); if (!id) return;
  const ref = db.collection("data/users/" + id).doc("state");
  const snap = await ref.get();
  const remote = snap.exists ? snap.data() : null;
  if (remote && typeof remote.json === "string" && (remote.savedAt || 0) > (S.savedAt || 0)) {
    S = migrate(JSON.parse(remote.json)); lsSet(KEY_STATE, remote.json); resetForLanguage(); render();
  }
  dbRef = ref;
  if (!remote && S.savedAt) save();
})().catch(() => {});

if (window.PARLEY_STANDALONE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
buildQueue();
render();
</script>
